<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-label="sphere icon">
  <defs>
    <pattern id="hatch-sphere" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="2"/>
    </pattern>
    <clipPath id="clip-sphere">
      <circle cx="64" cy="64" r="36"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-sphere)">
    <rect x="16" y="28" width="48" height="72" fill="url(#hatch-sphere)"/>
  </g>
  <circle cx="64" cy="64" r="36" fill="none" stroke="#000" stroke-width="4"/>
  <ellipse cx="64" cy="64" rx="32" ry="12" fill="none" stroke="#000" stroke-width="4"/>
</svg>
