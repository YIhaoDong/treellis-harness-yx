<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140" viewBox="0 0 200 140">
  <defs>
    <!-- 斜线条填充：stroke-width 从 2 调到 4 -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="4"/>
    </pattern>

    <circle id="A" cx="70" cy="70" r="50"/>
    <circle id="B" cx="130" cy="70" r="50"/>

    <mask id="m_intersect" maskUnits="userSpaceOnUse">
      <rect width="200" height="140" fill="black"/>
      <use href="#B" fill="white"/>
    </mask>
  </defs>

  <!-- 用加粗条纹填充交集 -->
  <use href="#A" fill="url(#hatch)" mask="url(#m_intersect)"/>

  <!-- 粗外轮廓 -->
  <g fill="none" stroke="#000" stroke-width="6">
    <use href="#A"/><use href="#B"/>
  </g>
</svg>
