# Alternative to the Caddyfile when the server already runs nginx.
# Install: sudo cp deploy/nginx.conf /etc/nginx/conf.d/treellis-api.conf
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d api.treellis.art   (adds the HTTPS server block)
server {
    listen 80;
    server_name api.treellis.art;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation progress is streamed as NDJSON; long runs send a heartbeat every 15 s.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 10m;
    }
}
